<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat met Noah</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #102b30;
      color: #f3fffb;
      font-family: Arial, sans-serif;
    }

    .app {
      width: min(100%, 520px);
      height: min(100vh, 760px);
      display: flex;
      flex-direction: column;
      background: #173a40;
      box-shadow: 0 15px 50px #061619;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px;
      background: #123036;
    }

    .avatar {
      position: relative;
      width: 76px;
      height: 76px;
      flex: none;
      overflow: hidden;
      border-radius: 50%;
      background: #90d9ca;
      border: 3px solid #65dec7;
    }

    .hoodie {
      position: absolute;
      width: 75px;
      height: 35px;
      left: 0;
      top: 57px;
      border-radius: 35px 35px 0 0;
      background: #258d83;
    }

    .face {
      position: absolute;
      width: 43px;
      height: 52px;
      left: 15px;
      top: 14px;
      border-radius: 45% 45% 48% 48%;
      background: #eab18f;
    }

    .hair {
      position: absolute;
      width: 51px;
      height: 25px;
      left: 11px;
      top: 8px;
      border-radius: 55% 60% 35% 20%;
      background: #272332;
      transform: rotate(-8deg);
    }

    .hair::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 18px;
      left: 3px;
      top: 12px;
      border-radius: 50%;
      background: #272332;
    }

    .eyes {
      position: absolute;
      left: 24px;
      top: 40px;
      color: #347d68;
      font-size: 15px;
      letter-spacing: 9px;
      line-height: 1;
    }

    .smile {
      position: absolute;
      left: 32px;
      top: 50px;
      font-size: 21px;
      color: #9c5961;
      line-height: 1;
    }

    header h1 { margin: 0 0 4px; font-size: 22px; }
    header p { margin: 0; color: #b6d7d0; font-size: 13px; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 82%;
      width: fit-content;
      padding: 11px 14px;
      margin-bottom: 12px;
      border-radius: 17px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .noah { background: #275b5b; }
    .you {
      margin-left: auto;
      background: #79dfc5;
      color: #10332d;
    }

    form {
      display: flex;
      gap: 9px;
      padding: 14px;
      background: #123036;
    }

    input {
      flex: 1;
      min-width: 0;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 0 17px;
      background: #79dfc5;
      color: #10332d;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="avatar" aria-label="Getekend portret van Noah">
        <div class="hoodie"></div>
        <div class="face"></div>
        <div class="hair"></div>
        <div class="eyes">●●</div>
        <div class="smile">⌣</div>
      </div>
      <div>
        <h1>Noah 💚</h1>
        <p>Fictieve chatvriend • 13 jaar</p>
      </div>
    </header>

    <div id="chat" aria-live="polite"></div>

    <form id="form">
      <input id="invoer" placeholder="Typ hier iets..." autocomplete="off">
      <button type="submit">Stuur</button>
    </form>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const invoer = document.getElementById("invoer");

    function bericht(tekst, vanWie) {
      const vak = document.createElement("div");
      vak.className = "message " + vanWie;
      vak.textContent = tekst;
      chat.appendChild(vak);
      chat.scrollTop = chat.scrollHeight;
    }

    function antwoordOp(tekst) {
      const zin = tekst.toLowerCase();

      if (/verdrietig|eenzaam|huil|rot/.test(zin)) {
        return "Dat klinkt moeilijk. Wil je vertellen wat er is? Praat er ook over met iemand die je vertrouwt. 💚";
      }
      if (/hoi|hallo|hey/.test(zin)) {
        return "Hey! Leuk dat je er bent 😊 Hoe was je dag?";
      }
      if (/school|huiswerk|toets/.test(zin)) {
        return "Hoe ging het op school? Als je wilt, kunnen we samen iets oefenen.";
      }
      if (/crush|verliefd|lief|vriendje/.test(zin)) {
        return "Aw, wat lief gezegd 😊 Vertel, wat maakt iemand voor jou leuk?";
      }
      if (/game|gamen|spel/.test(zin)) {
        return "Leuk! Welke game speel je graag?";
      }
      if (zin.includes("?")) {
        return "Goede vraag! Vertel me iets meer, dan denk ik met je mee.";
      }

      const reacties = [
        "Vertel verder, ik ben benieuwd 🙂",
        "En hoe voelde dat voor jou?",
        "Haha, echt? Wat gebeurde er daarna?",
        "Ik vind het gezellig om met je te praten 💚"
      ];

      return reacties[Math.floor(Math.random() * reacties.length)];
    }

    document.getElementById("form").addEventListener("submit", function (event) {
      event.preventDefault();

      const tekst = invoer.value.trim();
      if (!tekst) return;

      bericht(tekst, "you");
      invoer.value = "";

      setTimeout(function () {
        bericht(antwoordOp(tekst), "noah");
      }, 500);
    });

    bericht("Hey! Ik ben Noah 🙂 Hoe was je dag?", "noah");
  </script>
</body>
</html>
