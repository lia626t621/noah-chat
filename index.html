<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat met Noah</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #102b30;
      color: #f3fffb;
      font-family: Arial, sans-serif;
    }

    .app {
      width: min(100%, 520px);
      height: min(100vh, 760px);
      display: flex;
      flex-direction: column;
      background: #173a40;
      box-shadow: 0 15px 50px #061619;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
      background: #123036;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      flex: none;
      border: 3px solid #65dec7;
      border-radius: 50%;
      background: #90d9ca;
      font-size: 35px;
    }

    h1 { margin: 0 0 4px; font-size: 21px; }
    header p { margin: 0; color: #b6d7d0; font-size: 12px; }

    .relationship {
      padding: 14px;
      background: #19444a;
      border-bottom: 1px solid #397d78;
    }

    .relationship-top,
    .stages {
      display: flex;
      justify-content: space-between;
      gap: 7px;
    }

    .relationship-top { font-size: 13px; }

    .stages { margin: 12px 0 10px; }

    .stage {
      flex: 1;
      padding: 7px 3px;
      border-radius: 8px;
      background: #275b5b;
      color: #b6d7d0;
      text-align: center;
      font-size: 12px;
    }

    .stage.active {
      background: #79dfc5;
      color: #10332d;
      font-weight: bold;
    }

    .bar {
      height: 12px;
      overflow: hidden;
      border-radius: 99px;
      background: #0e2d31;
      border: 1px solid #397d78;
    }

    #barFill {
      width: 0%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #51bba9, #a5ffe0);
      transition: width .4s ease;
    }

    #progressText {
      margin: 8px 0 0;
      color: #c5e1d9;
      font-size: 12px;
      line-height: 1.4;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 17px;
    }

    .message {
      width: fit-content;
      max-width: 84%;
      margin-bottom: 11px;
      padding: 11px 14px;
      border-radius: 17px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .noah { background: #275b5b; }

    .you {
      margin-left: auto;
      background: #79dfc5;
      color: #10332d;
    }

    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #123036;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
    }

    form button {
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      background: #79dfc5;
      color: #10332d;
      font-weight: bold;
      cursor: pointer;
    }

    form button:disabled { opacity: .6; }

    footer {
      padding: 0 12px 10px;
      background: #123036;
      color: #b6d7d0;
      text-align: center;
      font-size: 11px;
    }

    footer button {
      border: 0;
      background: none;
      color: #b6d7d0;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="avatar" aria-hidden="true">🙂</div>
      <div>
        <h1>Noah 💚</h1>
        <p>Fictief chatpersonage • 13 jaar • geen echte AI</p>
      </div>
    </header>

    <section class="relationship" aria-label="Relatietijdlijn">
      <div class="relationship-top">
        <strong>Onze tijdlijn</strong>
        <strong id="status">Vreemden</strong>
      </div>

      <div class="stages">
        <span class="stage" id="stage0">Vreemden</span>
        <span class="stage" id="stage1">Vrienden</span>
        <span class="stage" id="stage2">Een stel</span>
      </div>

      <div
        class="bar"
        id="progressBar"
        role="progressbar"
        aria-label="Voortgang naar de volgende fase"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div id="barFill"></div>
      </div>

      <p id="progressText"></p>
    </section>

    <div id="chat" aria-live="polite"></div>

    <form id="form">
      <input
        id="invoer"
        placeholder="Typ hier iets..."
        autocomplete="off"
        maxlength="500"
        aria-label="Jouw bericht"
      >
      <button id="stuur" type="submit">Stuur</button>
    </form>

    <footer>
      Gesprek wordt in deze browser bewaard.
      <button id="reset" type="button">Wis gesprek</button>
    </footer>
  </main>

  <script>
    const KEY = "noah-chat-met-tijdbalk-v1";

    const chat = document.getElementById("chat");
    const invoer = document.getElementById("invoer");
    const stuur = document.getElementById("stuur");

    function today() {
      const now = new Date();
      return [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0")
      ].join("-");
    }

    function newState() {
      return {
        phase: 0,
        firstDay: today(),
        days: [],
        meaningfulMessages: 0,
        topic: "",
        question: "",
        lastReply: "",
        messages: []
      };
    }

    let state;

    try {
      state = JSON.parse(localStorage.getItem(KEY)) || newState();

      if (
        !Array.isArray(state.days) ||
        !Array.isArray(state.messages) ||
        ![0, 1, 2].includes(state.phase)
      ) {
        state = newState();
      }
    } catch {
      state = newState();
    }

    function save() {
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
      } catch {
        // De chat blijft werken als opslag niet beschikbaar is.
      }
    }

    function showMessage(text, sender, store = true) {
      const bubble = document.createElement("div");
      bubble.className = "message " + sender;
      bubble.textContent = text;
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;

      if (store) {
        state.messages.push({ text, sender });
        state.messages = state.messages.slice(-120);
        save();
      }
    }

    function daysSince(date) {
      const start = new Date(date + "T12:00:00");
      const end = new Date(today() + "T12:00:00");
      return Math.max(0, Math.round((end - start) / 86400000));
    }

    function updateTimeline() {
      const names = ["Vreemden", "Vrienden", "Een stel"];
      document.getElementById("status").textContent = names[state.phase];

      for (let i = 0; i < 3; i++) {
        document.getElementById("stage" + i)
          .classList.toggle("active", i <= state.phase);
      }

      let percentage;
      let explanation;

      if (state.phase === 0) {
        const messages = Math.min(state.meaningfulMessages / 12, 1);
        const days = Math.min(state.days.length / 2, 1);

        percentage = Math.round(((messages + days) / 2) * 100);
        explanation =
          `${state.meaningfulMessages}/12 gesprekkenberichten • ` +
          `${state.days.length}/2 verschillende dagen tot vriendschap.`;
      } else if (state.phase === 1) {
        const messages = Math.min(state.meaningfulMessages / 40, 1);
        const days = Math.min(daysSince(state.firstDay) / 7, 1);

        percentage = Math.round(((messages + days) / 2) * 100);
        explanation =
          `${state.meaningfulMessages}/40 gesprekkenberichten • ` +
          `${daysSince(state.firstDay)}/7 dagen. ` +
          `Bij 100% worden jullie niet automatisch een stel: ` +
          `dat kan alleen als jij het vraagt.`;
      } else {
        percentage = 100;
        explanation = "Jullie zijn in dit fictieve verhaal een stel. 💚";
      }

      document.getElementById("barFill").style.width = percentage + "%";
      document.getElementById("progressBar")
        .setAttribute("aria-valuenow", percentage);
      document.getElementById("progressText").textContent = explanation;
    }

    function pick(options) {
      const choices = options.filter(item => item !== state.lastReply);
      const list = choices.length ? choices : options;
      const reply = list[Math.floor(Math.random() * list.length)];
      state.lastReply = reply;
      return reply;
    }

    function sayAndAsk(topic, question, reply) {
      state.topic = topic;
      state.question = question;
      return reply;
    }

    function shortened(text) {
      const clean = text.replace(/\s+/g, " ").trim();
      return clean.length > 55 ? clean.slice(0, 52) + "..." : clean;
    }

    function subjectOf(text) {
      if (/\b(toets|school|huiswerk|leraar|cijfer|wiskunde|les)\b/.test(text))
        return "school";

      if (/\b(gamen|game|spel|minecraft|roblox)\b/.test(text))
        return "games";

      if (/\b(muziek|liedje|nummer|artiest)\b/.test(text))
        return "muziek";

      if (/\b(crush|verliefd|daten|verkering)\b/.test(text))
        return "crush";

      if (/\b(film|serie|bioscoop)\b/.test(text))
        return "film";

      if (/\b(vriend|vriendin|ruzie)\b/.test(text))
        return "vrienden";

      return "";
    }

    function replyTo(original) {
      const text = original.toLowerCase().trim();
      const quote = shortened(original);

      // Belangrijke en persoonlijke berichten gaan altijd voor.
      if (
        /ik wil dood|zelfmoord|mezelf pijn doen|zelfbeschadig/.test(text)
      ) {
        state.topic = "gevoel";
        return "Het klinkt alsof je het heel zwaar hebt. Vertel dit alsjeblieft meteen aan een volwassene die je vertrouwt. Ben je direct in gevaar? Bel de hulpdiensten.";
      }

      if (
        /stop met flirten|niet flirten|niet zo klef|geen verkering|ik wil stoppen|het is uit/.test(text)
      ) {
        if (state.phase === 2 && /ik wil stoppen|het is uit/.test(text)) {
          state.phase = 1;
          state.topic = "";
          return "Oké. Ik respecteer dat. In ons verhaal zijn we weer vrienden, als jij dat wilt.";
        }

        state.topic = "";
        return "Natuurlijk. Ik respecteer wat je zegt en houd het gewoon vriendschappelijk.";
      }

      if (/verdrietig|eenzaam|somber|ik huil|ik ben bang|ik voel me rot/.test(text)) {
        return sayAndAsk(
          "gevoel",
          "wat is er gebeurd",
          "Dat klinkt moeilijk 💚 Wil je vertellen wat er gebeurd is? Je kunt ook praten met iemand die je vertrouwt."
        );
      }

      if (/ben je echt|ben je een ai|ben je een bot|wie ben jij/.test(text)) {
        return "Ik ben Noah, een fictief chatpersonage. Ik ben geen echt persoon en begrijp nog niet alles wat je typt.";
      }

      // Eerst reageren op een vraag over verkering, vóór andere onderwerpen.
      const asksRelationship =
        /wil je (met mij )?verkering|zullen we (verkering|een stel)|wil je mijn vriendje zijn|wil je mijn partner zijn|ik wil verkering met (je|jou)|kunnen we (verkering|een stel)/.test(text);

      if (asksRelationship) {
        state.topic = "relatie";

        if (state.phase === 2) {
          return "Haha, in ons verhaal hebben we al verkering 💚";
        }

        if (state.phase === 0) {
          return "Ik snap wat je vraagt, en dat is lief 😊 Maar we kennen elkaar nog maar net. Laten we eerst rustig vrienden worden.";
        }

        if (
          state.meaningfulMessages < 40 ||
          daysSince(state.firstDay) < 7
        ) {
          return "Ik snap je vraag echt 😊 We zijn vrienden, maar laten we nog wat langer de tijd nemen om elkaar te leren kennen. Je kunt op de balk zien hoe ver het verhaal is.";
        }

        state.phase = 2;
        return "Ja, dat lijkt me leuk 😊 We hebben rustig de tijd genomen. In ons fictieve verhaal zijn we nu een stel 💚";
      }

      if (/hou je van me|hou je van mij|vind je mij leuk/.test(text)) {
        return state.phase === 2
          ? "Ik vind het fijn om in ons verhaal samen te zijn 💚 Wat vind jij leuk aan onze gesprekken?"
          : "Ik vind het gezellig om met je te praten 😊 Maar we hoeven niets te overhaasten.";
      }

      if (/^(hoi|hallo|hey|hee|heyy)[!?. ]*$/.test(text)) {
        return sayAndAsk(
          "dag",
          "hoe was je dag",
          pick([
            "Hey 🙂 Hoe was je dag?",
            "Hoi! Wat heb je vandaag gedaan?",
            "Hee, leuk dat je er bent. Hoe gaat het?"
          ])
        );
      }

      if (/hoe gaat het met (je|jou)|hoe is het met je/.test(text)) {
        return sayAndAsk(
          "dag",
          "hoe gaat het met jou",
          "Goed hoor 🙂 En hoe gaat het met jou?"
        );
      }

      // Als jij antwoord geeft op Noahs vraag, gebruikt hij die context.
      if (/^(ja|jazeker|zeker|klopt|nee|nope|nah)[!?. ]*$/.test(text)) {
        const yes = /^(ja|jazeker|zeker|klopt)/.test(text);

        if (state.topic === "gevoel") {
          return sayAndAsk(
            "gevoel",
            "wat wil je vertellen",
            yes
              ? "Ik luister. Wat wil je erover vertellen?"
              : "Dat is oké. We kunnen ook over iets anders praten."
          );
        }

        if (state.topic === "school") {
          return sayAndAsk(
            "school",
            "welk vak",
            yes
              ? "Oké! Welk vak of welke opdracht bedoel je?"
              : "Snap ik. Waar wil je dan liever over praten?"
          );
        }

        if (state.topic === "crush") {
          return sayAndAsk(
            "crush",
            "wat gebeurde er",
            yes
              ? "Oeh, vertel: wat gebeurde er?"
              : "Geen probleem. Je hoeft er niet over te vertellen."
          );
        }

        if (state.topic === "dag") {
          return sayAndAsk(
            "dag",
            "wat gebeurde er",
            yes
              ? "Mooi 🙂 Wat maakte je dag fijn?"
              : "Oei, wat maakte je dag minder leuk?"
          );
        }

        return "Ik weet niet zeker waarop je antwoordt. Kun je er iets meer bij vertellen?";
      }

      // Een nieuw genoemd onderwerp krijgt voorrang op het oude onderwerp.
      const newSubject = subjectOf(text);

      if (newSubject === "school") {
        return sayAndAsk(
          "school",
          "wat is er met school",
          pick([
            `Je hebt het over “${quote}”. Wat gebeurde er precies op school?`,
            `Over “${quote}”: wil je erover vertellen of wil je dat ik je met iets help?`
          ])
        );
      }

      if (newSubject === "games") {
        return sayAndAsk(
          "games",
          "welke game en wat gebeurde er",
          `Oeh, gamen 🎮 Wat gebeurde er bij “${quote}”?`
        );
      }

      if (newSubject === "muziek") {
        return sayAndAsk(
          "muziek",
          "welk nummer",
          `Muziek! Welk nummer bedoel je bij “${quote}”?`
        );
      }

      if (newSubject === "crush") {
        return sayAndAsk(
          "crush",
          "wat vind je leuk aan diegene",
          `Oeh, vertel 😊 Wat vind je leuk aan diegene?`
        );
      }

      if (newSubject === "film") {
        return sayAndAsk(
          "film",
          "vond je het leuk",
          `Ah, “${quote}”. Vond je het leuk om te kijken?`
        );
      }

      if (newSubject === "vrienden") {
        return sayAndAsk(
          "vrienden",
          "wat gebeurde er",
          `Vertel eens wat er gebeurde met je vriend of vriendin.`
        );
      }

      // Vrije antwoorden op een eerdere vraag.
      if (state.topic === "dag") {
        return sayAndAsk(
          "dag",
          "hoe voelde je je daarbij",
          `Ah, dus “${quote}”. Hoe voelde je je daarbij?`
        );
      }

      if (state.topic === "school") {
        return sayAndAsk(
          "school",
          "wat wil je weten",
          `Oké, over “${quote}”: wat wil je precies weten of oefenen?`
        );
      }

      if (state.topic === "gevoel") {
        return sayAndAsk(
          "gevoel",
          "wat zou helpen",
          "Dank je dat je dat vertelt. Wil je er verder over praten, of wil je liever even afleiding?"
        );
      }

      if (state.topic === "crush") {
        return sayAndAsk(
          "crush",
          "wat wil jij",
          "Ik snap je 😊 Wat zou jij het liefst willen dat er gebeurt?"
        );
      }

      if (state.topic === "games") {
        return sayAndAsk(
          "games",
          "wat gebeurde daarna",
          `Oké, “${quote}”. Wat gebeurde er daarna in het spel?`
        );
      }

      if (text.includes("?")) {
        state.topic = "";
        return "Ik wil je vraag niet verkeerd begrijpen. Kun je uitleggen wat je precies bedoelt?";
      }

      return sayAndAsk(
        "algemeen",
        "vertel meer",
        pick([
          `Je vertelt over “${quote}”. Wat gebeurde er daarna?`,
          `“${quote}” — wat was voor jou het belangrijkste daaraan?`,
          `Ik ben benieuwd: kun je me iets meer vertellen over “${quote}”?`
        ])
      );
    }

    function maybeBecomeFriends() {
      if (
        state.phase === 0 &&
        state.meaningfulMessages >= 12 &&
        state.days.length >= 2
      ) {
        state.phase = 1;
        return true;
      }

      return false;
    }

    document.getElementById("form").addEventListener("submit", event => {
      event.preventDefault();

      const text = invoer.value.trim();
      if (!text || stuur.disabled) return;

      showMessage(text, "you");
      invoer.value = "";
      stuur.disabled = true;

      if (!state.days.includes(today())) {
        state.days.push(today());
      }

      // Heel korte berichtjes vullen de balk niet telkens verder.
      if (
        text.length >= 5 &&
        !/^(hoi|hallo|hey|ja|nee)[!?. ]*$/i.test(text)
      ) {
        state.meaningfulMessages++;
      }

      const becameFriends = maybeBecomeFriends();

      setTimeout(() => {
        let reply = replyTo(text);

        if (becameFriends) {
          reply += "\n\nTrouwens, we hebben elkaar nu wat beter leren kennen. Volgens onze tijdlijn zijn we vrienden geworden 🙂";
        }

        showMessage(reply, "noah");
        updateTimeline();
        save();
        stuur.disabled = false;
        invoer.focus();
      }, 500);
    });

    document.getElementById("reset").addEventListener("click", () => {
      if (!confirm("Wil je het gesprek en de tijdsbalk wissen?")) return;

      localStorage.removeItem(KEY);
      state = newState();
      chat.textContent = "";

      showMessage(
        "Hey, ik ben Noah 🙂 We kennen elkaar nog niet. Waar wil je over kletsen?",
        "noah"
      );

      updateTimeline();
    });

    state.messages.forEach(message => {
      showMessage(message.text, message.sender, false);
    });

    if (state.messages.length === 0) {
      showMessage(
        "Hey, ik ben Noah 🙂 We kennen elkaar nog niet. Waar wil je over kletsen?",
        "noah"
      );
    }

    updateTimeline();
  </script>
</body>
</html>
