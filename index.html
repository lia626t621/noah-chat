<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat met Noah</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #102b30;
      color: #f3fffb;
      font-family: Arial, sans-serif;
    }

    .app {
      width: min(100%, 520px);
      height: min(100vh, 760px);
      display: flex;
      flex-direction: column;
      background: #173a40;
      box-shadow: 0 15px 50px #061619;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px;
      background: #123036;
    }

    .avatar {
      width: 65px;
      height: 65px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 3px solid #65dec7;
      background: #90d9ca;
      font-size: 37px;
    }

    header h1 { margin: 0 0 4px; font-size: 21px; }
    header p { margin: 0; color: #b6d7d0; font-size: 12px; }

    .timeline {
      padding: 11px 15px;
      background: #19444a;
      border-bottom: 1px solid #397d78;
    }

    .timeline-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }

    .steps {
      display: flex;
      gap: 6px;
      margin-top: 9px;
    }

    .step {
      flex: 1;
      padding: 7px 3px;
      border-radius: 9px;
      background: #275b5b;
      color: #b6d7d0;
      text-align: center;
      font-size: 12px;
    }

    .step.active {
      background: #79dfc5;
      color: #10332d;
      font-weight: bold;
    }

    #tijdlijnTekst {
      margin: 8px 0 0;
      color: #b6d7d0;
      font-size: 12px;
      line-height: 1.4;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 17px;
    }

    .message {
      max-width: 84%;
      width: fit-content;
      padding: 11px 14px;
      margin-bottom: 11px;
      border-radius: 17px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .noah { background: #275b5b; }

    .you {
      margin-left: auto;
      background: #79dfc5;
      color: #10332d;
    }

    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #123036;
    }

    input {
      flex: 1;
      min-width: 0;
      border: 0;
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 0 14px;
      background: #79dfc5;
      color: #10332d;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    .footer {
      padding: 0 12px 10px;
      background: #123036;
      color: #b6d7d0;
      font-size: 11px;
      text-align: center;
    }

    .footer button {
      padding: 0;
      background: none;
      color: #b6d7d0;
      text-decoration: underline;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="avatar" aria-hidden="true">🙂</div>
      <div>
        <h1>Noah 💚</h1>
        <p>Fictieve chatvriend • 13 jaar • geen echte AI</p>
      </div>
    </header>

    <section class="timeline" aria-label="Relatietijdlijn">
      <div class="timeline-top">
        <strong>Onze tijdlijn</strong>
        <span id="status">Vreemden</span>
      </div>
      <div class="steps">
        <span class="step" id="stap0">Vreemden</span>
        <span class="step" id="stap1">Vrienden</span>
        <span class="step" id="stap2">Een stel</span>
      </div>
      <p id="tijdlijnTekst"></p>
    </section>

    <div id="chat" aria-live="polite"></div>

    <form id="form">
      <input id="invoer" placeholder="Typ hier iets..." autocomplete="off" maxlength="400">
      <button id="stuur" type="submit">Stuur</button>
    </form>

    <div class="footer">
      Gesprek wordt alleen in deze browser bewaard.
      <button id="reset" type="button">Wis gesprek</button>
    </div>
  </main>

  <script>
    const sleutel = "noah-chat-versie-2";
    const chat = document.getElementById("chat");
    const invoer = document.getElementById("invoer");
    const stuur = document.getElementById("stuur");

    function vandaag() {
      const nu = new Date();
      return [
        nu.getFullYear(),
        String(nu.getMonth() + 1).padStart(2, "0"),
        String(nu.getDate()).padStart(2, "0")
      ].join("-");
    }

    function nieuweStaat() {
      return {
        fase: 0,
        eersteDag: vandaag(),
        dagen: [],
        aantalBerichten: 0,
        laatsteOnderwerp: "",
        laatsteVraag: "",
        vorigAntwoord: "",
        geschiedenis: [],
        momenten: [
          { datum: vandaag(), tekst: "Jullie ontmoetten elkaar." }
        ]
      };
    }

    let staat;

    try {
      staat = JSON.parse(localStorage.getItem(sleutel)) || nieuweStaat();
      if (!Array.isArray(staat.geschiedenis) ||
          !Array.isArray(staat.dagen) ||
          !Array.isArray(staat.momenten)) {
        staat = nieuweStaat();
      }
    } catch {
      staat = nieuweStaat();
    }

    function bewaar() {
      try {
        localStorage.setItem(sleutel, JSON.stringify(staat));
      } catch {
        // De chat blijft werken als de browser geen opslag toestaat.
      }
    }

    function toonBericht(tekst, vanWie, opslaan = true) {
      const vak = document.createElement("div");
      vak.className = "message " + vanWie;
      vak.textContent = tekst;
      chat.appendChild(vak);
      chat.scrollTop = chat.scrollHeight;

      if (opslaan) {
        staat.geschiedenis.push({ tekst, vanWie });
        staat.geschiedenis = staat.geschiedenis.slice(-100);
        bewaar();
      }
    }

    function aantalDagenSinds(startdatum) {
      const start = new Date(startdatum + "T12:00:00");
      const nu = new Date(vandaag() + "T12:00:00");
      return Math.max(0, Math.round((nu - start) / 86400000));
    }

    function updateTijdlijn() {
      const namen = ["Vreemden", "Vrienden", "Een stel"];
      document.getElementById("status").textContent = namen[staat.fase];

      for (let i = 0; i < 3; i++) {
        document.getElementById("stap" + i)
          .classList.toggle("active", i <= staat.fase);
      }

      const laatste = staat.momenten.at(-1);
      const gebeurtenis = laatste
        ? laatste.datum + ": " + laatste.tekst
        : "";

      let uitleg = "";

      if (staat.fase === 0) {
        uitleg = "Jullie leren elkaar rustig kennen.";
      } else if (staat.fase === 1) {
        uitleg = "Jullie zijn vrienden. Een relatie ontstaat niet automatisch.";
      } else {
        uitleg = "Jullie zijn in dit fictieve verhaal een stel.";
      }

      document.getElementById("tijdlijnTekst").textContent =
        gebeurtenis + " " + uitleg;
    }

    function kies(opties) {
      const anders = opties.filter(tekst => tekst !== staat.vorigAntwoord);
      const lijst = anders.length ? anders : opties;
      const antwoord = lijst[Math.floor(Math.random() * lijst.length)];
      staat.vorigAntwoord = antwoord;
      return antwoord;
    }

    function kort(tekst) {
      const schoon = tekst.replace(/\s+/g, " ").trim();
      return schoon.length > 65
        ? schoon.slice(0, 62).trimEnd() + "..."
        : schoon;
    }

    function vraag(onderwerp, tekst) {
      staat.laatsteOnderwerp = onderwerp;
      staat.laatsteVraag = tekst;
      return tekst;
    }

    function onderwerpVan(zin) {
      if (/\b(toets|huiswerk|school|les|cijfer|leraar|wiskunde)\b/.test(zin))
        return "school";

      if (/\b(game|gamen|spel|minecraft|roblox)\b/.test(zin))
        return "games";

      if (/\b(muziek|liedje|nummer|zingen|artiest)\b/.test(zin))
        return "muziek";

      if (/\b(film|serie|bioscoop)\b/.test(zin))
        return "film";

      if (/\b(crush|verliefd|verkering|daten)\b/.test(zin))
        return "crush";

      if (/\b(eten|honger|pizza|snack)\b/.test(zin))
        return "eten";

      return "";
    }

    function antwoordOp(tekst) {
      const zin = tekst.toLowerCase().trim();
      const schoon = kort(tekst);

      // Serieuze berichten krijgen voorrang op alle speelse reacties.
      if (/ik wil dood|zelfmoord|mezelf pijn doen|zelfbeschadig/.test(zin)) {
        staat.laatsteOnderwerp = "";
        return "Het klinkt alsof je het heel zwaar hebt. Vertel dit alsjeblieft nu aan een volwassene die je vertrouwt. Ben je direct in gevaar? Bel dan de hulpdiensten.";
      }

      if (/verdrietig|eenzaam|ik huil|somber|ik ben bang|ik voel me rot/.test(zin)) {
        return vraag(
          "gevoel",
          "Dat klinkt moeilijk 💚 Wat is er gebeurd? Je mag er ook met iemand die je vertrouwt over praten."
        );
      }

      if (/stop met flirten|niet flirten|niet zo klef|doe normaal/.test(zin)) {
        staat.laatsteOnderwerp = "";
        staat.laatsteVraag = "";
        return "Natuurlijk. Ik houd het gewoon vriendschappelijk. Waar wil je het over hebben?";
      }

      if (/ben je echt|ben je een ai|ben je een bot|wie ben jij/.test(zin)) {
        return "Ik ben Noah: een fictief chatpersonage. Ik kan sommige dingen uit ons gesprek onthouden, maar ik ben geen echt persoon of echte AI.";
      }

      // Een relatie begint nooit zomaar doordat iemand iets liefs zegt.
      if (/wil je verkering|zullen we verkering|wil je mijn vriendje zijn|zullen we een stel/.test(zin)) {
        const langGenoeg = aantalDagenSinds(staat.eersteDag) >= 7;
        const genoegGesprekken = staat.aantalBerichten >= 40;

        if (staat.fase === 1 && langGenoeg && genoegGesprekken) {
          staat.fase = 2;
          staat.momenten.push({
            datum: vandaag(),
            tekst: "Jullie besloten in dit verhaal een stel te worden."
          });
          updateTijdlijn();
          return "Ja, dat lijkt me leuk 😊 We hebben elkaar rustig leren kennen. In ons verhaal zijn we nu een stel 💚";
        }

        return "Dat is lief dat je het vraagt 😊 Maar laten we elkaar eerst rustig beter leren kennen. Zoiets hoeft niet snel.";
      }

      if (/^(hoi|hallo|hey|hee|heyy)[!?. ]*$/.test(zin)) {
        return vraag(
          "dag",
          kies([
            "Hey! Hoe is je dag tot nu toe?",
            "Hoi 🙂 Wat heb je vandaag gedaan?",
            "Hee! Vertel eens: wat hield je vandaag bezig?"
          ])
        );
      }

      if (/hoe gaat het met (je|jou)|hoe is het met je/.test(zin)) {
        return vraag(
          "dag",
          "Goed hoor, dank je 🙂 En hoe gaat het met jou?"
        );
      }

      if (/^(ja|jazeker|zeker|klopt|nee|nope|nah)[!?. ]*$/.test(zin)) {
        const isJa = /^(ja|jazeker|zeker|klopt)/.test(zin);
        const vorig = staat.laatsteOnderwerp;

        if (vorig === "crush") {
          return vraag(
            "crush",
            isJa
              ? "Oeh, vertel: wat gebeurde er tussen jullie?"
              : "Oké, vertel dan eens hoe het precies zit."
          );
        }

        if (vorig === "school") {
          return vraag(
            "school",
            isJa
              ? "Oké! Welk vak of welke opdracht bedoel je?"
              : "Snap ik. Wat zou je liever doen?"
          );
        }

        if (vorig === "dag") {
          return vraag(
            "dag",
            isJa
              ? "Klinkt goed 🙂 Wat maakte je dag fijn?"
              : "Oei, was je dag niet zo leuk? Wat gebeurde er?"
          );
        }

        return isJa
          ? "Vertel verder 🙂 Waar zeg je precies ja op?"
          : "Helemaal goed. Waar wil je het liever over hebben?";
      }

      const nieuwOnderwerp = onderwerpVan(zin);

      if (nieuwOnderwerp === "school") {
        return vraag(
          "school",
          kies([
            `Je vertelt over “${schoon}”. Wat vond je daar lastig of juist leuk aan?`,
            `Oké, over “${schoon}”: wil je er gewoon over vertellen of samen iets uitzoeken?`
          ])
        );
      }

      if (nieuwOnderwerp === "games") {
        return vraag(
          "games",
          kies([
            `“${schoon}” klinkt als een gameverhaal 🎮 Wat gebeurde er?`,
            `Je hebt het over “${schoon}”. Speel je dat vaak?`
          ])
        );
      }

      if (nieuwOnderwerp === "muziek") {
        return vraag(
          "muziek",
          kies([
            `Over “${schoon}”: wat vind je er zo goed aan?`,
            `Ah, muziek 🎵 Bij “${schoon}” ben ik benieuwd: welk nummer bedoel je?`
          ])
        );
      }

      if (nieuwOnderwerp === "film") {
        return vraag(
          "film",
          `Je vertelt over “${schoon}”. Zou je het aanraden?`
        );
      }

      if (nieuwOnderwerp === "crush") {
        return vraag(
          "crush",
          kies([
            `Oeh, “${schoon}” 😊 Wat vind je leuk aan diegene?`,
            `Dat klinkt spannend. Hoe voel jij je bij “${schoon}”?`
          ])
        );
      }

      if (nieuwOnderwerp === "eten") {
        return vraag(
          "eten",
          `Nu heb ik een belangrijke vraag over “${schoon}”: wat vind jij het lekkerst?`
        );
      }

      // Een vrij antwoord op Noahs vorige vraag wordt niet als 'ja' ingevuld.
      if (staat.laatsteOnderwerp === "dag") {
        if (/\b(slecht|stom|vervelend|moeilijk)\b/.test(zin)) {
          return vraag(
            "gevoel",
            `Dat klinkt als een lastige dag. Wil je vertellen wat er gebeurde?`
          );
        }

        return vraag(
          "dag",
          `Je zegt: “${schoon}”. Wat was daarvan voor jou het leukste of belangrijkste moment?`
        );
      }

      if (staat.laatsteOnderwerp === "gevoel") {
        return vraag(
          "gevoel",
          `Dank je dat je het vertelt. Wat zou je nu helpen: verder praten of even afleiding?`
        );
      }

      if (staat.laatsteOnderwerp === "school") {
        return vraag(
          "school",
          `Oké, “${schoon}”. Wat wil je daar precies over weten of oefenen?`
        );
      }

      if (staat.laatsteOnderwerp === "crush") {
        return vraag(
          "crush",
          `Ik hoor je 🙂 Wat zou jij het liefst willen dat er nu gebeurt?`
        );
      }

      if (staat.laatsteOnderwerp === "games" ||
          staat.laatsteOnderwerp === "film" ||
          staat.laatsteOnderwerp === "muziek" ||
          staat.laatsteOnderwerp === "eten") {
        const onderwerp = staat.laatsteOnderwerp;
        return vraag(
          onderwerp,
          `Ah, “${schoon}”. Hoe kwam je daarbij?`
        );
      }

      if (zin.includes("?")) {
        staat.laatsteOnderwerp = "";
        return "Ik weet niet zeker of ik die vraag goed kan beantwoorden. Kun je iets preciezer vertellen wat je bedoelt?";
      }

      return vraag(
        "algemeen",
        kies([
          `Je zegt: “${schoon}”. Wat gebeurde er daarna?`,
          `Ik ben benieuwd naar “${schoon}”. Hoe voelde dat voor jou?`,
          `Vertel me meer over “${schoon}” 🙂`
        ])
      );
    }

    function controleerVriendschap() {
      if (
        staat.fase === 0 &&
        staat.aantalBerichten >= 12 &&
        staat.dagen.length >= 2
      ) {
        staat.fase = 1;
        staat.momenten.push({
          datum: vandaag(),
          tekst: "Jullie werden vrienden."
        });
        updateTijdlijn();
        return true;
      }

      return false;
    }

    document.getElementById("form").addEventListener("submit", event => {
      event.preventDefault();

      const tekst = invoer.value.trim();
      if (!tekst || stuur.disabled) return;

      toonBericht(tekst, "you");
      invoer.value = "";
      stuur.disabled = true;

      if (!staat.dagen.includes(vandaag())) {
        staat.dagen.push(vandaag());
      }

      // Een enkel 'hoi', 'ja' of emoji telt niet als volledig gesprek.
      if (tekst.length >= 5 && !/^(hoi|hallo|hey)[!?. ]*$/i.test(tekst)) {
        staat.aantalBerichten++;
      }

      const netVrienden = controleerVriendschap();

      setTimeout(() => {
        let antwoord = antwoordOp(tekst);

        if (netVrienden) {
          antwoord += "\n\nTrouwens: we praten nu al een tijdje, verspreid over verschillende dagen. Ik denk dat we vrienden zijn geworden 🙂";
        }

        toonBericht(antwoord, "noah");
        updateTijdlijn();
        bewaar();

        stuur.disabled = false;
        invoer.focus();
      }, 500);
    });

    document.getElementById("reset").addEventListener("click", () => {
      if (!confirm("Wil je het gesprek en de relatietijdlijn wissen?")) return;

      localStorage.removeItem(sleutel);
      staat = nieuweStaat();
      chat.textContent = "";
      updateTijdlijn();
      toonBericht(
        "Hey, ik ben Noah 🙂 We kennen elkaar nog niet. Waar wil je over kletsen?",
        "noah"
      );
    });

    staat.geschiedenis.forEach(item => {
      toonBericht(item.tekst, item.vanWie, false);
    });

    if (staat.geschiedenis.length === 0) {
      toonBericht(
        "Hey, ik ben Noah 🙂 We kennen elkaar nog niet. Waar wil je over kletsen?",
        "noah"
      );
    }

    updateTijdlijn();
  </script>
</body>
</html>
